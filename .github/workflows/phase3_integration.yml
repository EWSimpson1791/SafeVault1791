name: Phase-3B Integration CI
on:
  push:
    paths: ['ui/game_loop.py','tests/test_ui_game_loop_phase3.py']
  pull_request:
    paths: ['ui/game_loop.py','tests/test_ui_game_loop_phase3.py']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pytest
      - run: python -m py_compile ui/game_loop.py
      - run: pytest tests/test_ui_game_loop_phase3.py -v
